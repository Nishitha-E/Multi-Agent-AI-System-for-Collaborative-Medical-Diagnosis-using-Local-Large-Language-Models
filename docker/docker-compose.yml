version: '3.8'

services:
  aegis:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aegis_triage_app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:4b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/workspace/rag/data/chroma_db
    volumes:
      - chroma_data:/workspace/rag/data/chroma_db
      - reports_data:/workspace/frontend/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  chroma_data:
  reports_data:
